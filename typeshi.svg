<svg width="100%" viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulseRed {
        0% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(139,0,0,0.5)); }
        50% { opacity: 0.9; filter: drop-shadow(0 0 8px rgba(139,0,0,0.9)); }
        100% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(139,0,0,0.5)); }
      }
      @keyframes glitch {
        0% { transform: translate(0); }
        2% { transform: translate(-2px, 1px); }
        4% { transform: translate(0); }
        98% { transform: translate(0); }
        100% { transform: translate(1px, -1px); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
        100% { transform: translateY(0px); }
      }
      .anim-pulse { animation: pulseRed 4s infinite ease-in-out; }
      .anim-glitch { animation: glitch 3s infinite; }
      .anim-float { animation: float 6s infinite ease-in-out; }
      
      /* Hover effects for clickable buttons */
      .nav-link { cursor: pointer; outline: none; }
      .nav-link rect { transition: all 0.2s ease; }
      .nav-link text { transition: all 0.2s ease; pointer-events: none; }
      .nav-link:hover rect { fill: #1a0a0a; stroke: #ff4444; filter: drop-shadow(0 0 5px rgba(255,0,0,0.4)); }
      .nav-link:hover text { fill: #ffffff; }

      .tech-hover { transition: all 0.3s ease; }
      .tech-hover:hover { fill: #ffffff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
    </style>

    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
