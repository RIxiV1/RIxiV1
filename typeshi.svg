<svg width="100%" viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="typeshi-title typeshi-desc">
  <title id="typeshi-title">Shaik Suhaib — AI Engineer and Agentic Systems Specialist</title>
  <desc id="typeshi-desc">Samurai-themed profile card showing name, focus areas, and technical arsenal across languages, frontend, infrastructure, and AI agentic tooling.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description rdf:about="">
        <dc:title>Shaik Suhaib profile SVG</dc:title>
        <dc:description>Samurai-themed profile SVG with animated technical arsenal sections.</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <style>
      svg {
        --color-bg: #06080f;
        --color-bg-muted: #080a10;
        --color-card: #0a0c10;
        --color-primary: #8b0000;
        --color-accent: #e8e0d0;
        --color-border: #1a1208;
        --color-muted: #6a5a3a;
        --color-tech-alt: #8a7a5a;
        --font-mono: 'Courier New', monospace;
        --font-display: Impact, 'Arial Black', sans-serif;
      }
      @keyframes pulseRed {
        0% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(139,0,0,0.5)); }
        50% { opacity: 0.9; filter: drop-shadow(0 0 8px rgba(139,0,0,0.9)); }
        100% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(139,0,0,0.5)); }
      }
      @keyframes glitch {
        0% { transform: translate(0); }
        2% { transform: translate(-2px, 1px); }
        4% { transform: translate(0); }
        98% { transform: translate(0); }
        100% { transform: translate(1px, -1px); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
        100% { transform: translateY(0px); }
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .anim-pulse { animation: pulseRed 4s infinite ease-in-out; }
      .anim-glitch { animation: glitch 3s infinite; }
      .anim-float { animation: float 6s infinite ease-in-out; }
      .cursor { animation: blink 1s step-end infinite; }
      .with-shadow { filter: url(#shadow); }
      .mono { font-family: var(--font-mono); }
      .tech-title, .tech-title-primary { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; }
      .tech-title { fill: var(--color-muted); }
      .tech-title-primary { fill: var(--color-primary); font-weight: bold; }
      .tech-main, .tech-muted { font-family: var(--font-mono); font-size: 12px; }
      .tech-main-lg, .tech-muted-lg { font-family: var(--font-mono); font-size: 13px; }
      .tech-main, .tech-main-lg { fill: var(--color-accent); }
      .tech-muted, .tech-muted-lg { fill: var(--color-tech-alt); }
      .tech-divider { stroke: var(--color-border); stroke-width: 0.8; }

      /* Hover effects for clickable buttons */
      .nav-link { cursor: pointer; outline: none; }
      .nav-link rect { transition: all 0.2s ease; }
      .nav-link text { transition: all 0.2s ease; pointer-events: none; }
      .nav-link:hover rect { fill: #1a0a0a; stroke: #ff4444; filter: drop-shadow(0 0 5px rgba(255,0,0,0.4)); }
      .nav-link:hover text { fill: #ffffff; }

      .tech-hover { transition: all 0.3s ease; }
      .tech-hover:hover { fill: #ffffff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
    </style>

    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.03"/>
    </pattern>
    
    <clipPath id="torn1">
      <path d="M0 0 L385 0 L385 10 L372 24 L384 40 L373 58 L385 74 L374 92 L386 108 L375 126 L387 144 L376 162 L388 178 L377 196 L389 214 L378 232 L390 250 L379 268 L391 285 L380 303 L392 320 L381 338 L393 356 L382 374 L394 392 L383 410 L395 428 L384 446 L390 460 L0 460 Z"/>
    </clipPath>

    <filter id="shadow">
